<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060709"/>
      <stop offset="100%" stop-color="#0C0E13"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7FB"/>
      <stop offset="50%" stop-color="#C6CDD9"/>
      <stop offset="100%" stop-color="#8E97A8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#AEB8C8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#AEB8C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- black base -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="76" y="76" width="872" height="872" rx="190" fill="none" stroke="#3A4150" stroke-width="2" opacity="0.5"/>
  <circle cx="512" cy="512" r="360" fill="url(#sheen)"/>

  <!-- 机关刻度环：细环 + 两圈刻度（dasharray 模拟放射状刻度线） -->
  <circle cx="512" cy="512" r="398" fill="none" stroke="url(#silver)" stroke-width="4" opacity="0.85"/>
  <circle cx="512" cy="512" r="366" fill="none" stroke="#7C8598" stroke-width="2.5" opacity="0.45"/>
  <!-- 密刻度：60 格 -->
  <circle cx="512" cy="512" r="382" fill="none" stroke="#B9C2D0" stroke-width="13"
          stroke-dasharray="2.5 37.51" opacity="0.55"/>
  <!-- 主刻度：12 格 -->
  <circle cx="512" cy="512" r="381" fill="none" stroke="#E8EDF4" stroke-width="19"
          stroke-dasharray="4 195.55" opacity="0.9"/>

  <!-- 四正位菱形节点 -->
  <g fill="#060709" stroke="url(#silver)" stroke-width="5">
    <path d="M 512 106 L 526 128 L 512 150 L 498 128 Z"/>
    <path d="M 512 874 L 526 896 L 512 918 L 498 896 Z"/>
    <path d="M 106 512 L 128 498 L 150 512 L 128 526 Z"/>
    <path d="M 874 512 L 896 498 L 918 512 L 896 526 Z"/>
  </g>

  <!-- 兔耳：折面几何造型 -->
  <g fill="#060709" stroke="url(#silver)" stroke-width="13" stroke-linejoin="round">
    <path d="M 402 486 L 368 240 L 440 210 L 490 462"/>
    <path d="M 622 486 L 656 240 L 584 210 L 534 462"/>
  </g>
  <!-- 耳内折面刻线 -->
  <g stroke="#9AA4B5" stroke-width="4" opacity="0.55" fill="none">
    <path d="M 408 448 L 384 254 L 434 234"/>
    <path d="M 616 448 L 640 254 L 590 234"/>
  </g>

  <!-- 头：几何圆 -->
  <circle cx="512" cy="612" r="192" fill="#060709"/>
  <circle cx="512" cy="612" r="192" fill="none" stroke="url(#silver)" stroke-width="14"/>
  <!-- 头部内衬细环 -->
  <circle cx="512" cy="612" r="176" fill="none" stroke="#7C8598" stroke-width="2.5" opacity="0.4"/>

  <!-- 眼：轴心圆点 -->
  <circle cx="440" cy="606" r="14" fill="url(#silver)"/>
  <circle cx="584" cy="606" r="14" fill="url(#silver)"/>

  <!-- 鼻：倒三角 -->
  <path d="M 494 666 L 530 666 L 512 694 Z" fill="url(#silver)"/>

  <!-- 须：机括引线 + 方节点 -->
  <g stroke="#AEB8C8" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="368" y1="650" x2="298" y2="640"/>
    <line x1="370" y1="682" x2="302" y2="690"/>
    <line x1="656" y1="650" x2="726" y2="640"/>
    <line x1="654" y1="682" x2="722" y2="690"/>
  </g>
  <g fill="#8E97A8">
    <rect x="288" y="630" width="12" height="12" rx="2" transform="rotate(45 294 636)"/>
    <rect x="724" y="630" width="12" height="12" rx="2" transform="rotate(45 730 636)"/>
  </g>
</svg>
